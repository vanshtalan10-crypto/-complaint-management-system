```html
<!DOCTYPE html>
<html>

<head>

    <title>Register - Online Complaint Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <div class="logo">
        Online Complaint Management System
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/login">Login</a>

        <a href="/register">Register</a>

    </div>

</div>


<div class="container">

    <div class="card">

        <h2>CREATE ACCOUNT</h2>

        <form method="POST">


            <label>Student Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
                minlength="2"
                autocomplete="name"
            >


            <label>Student ID</label>

            <input
                type="text"
                name="student_id"
                placeholder="Enter your student ID"
                required
                minlength="2"
                autocomplete="off"
            >


            <label>Course</label>

            <input
                type="text"
                name="course"
                placeholder="Example: BCA"
                required
                minlength="2"
                autocomplete="off"
            >


            <label>Section</label>

            <input
                type="text"
                name="section"
                placeholder="Example: A"
                required
                minlength="1"
                autocomplete="off"
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
                autocomplete="email"
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
                minlength="5"
                autocomplete="new-password"
            >


            <button type="submit">
                Register
            </button>

        </form>


        <br>


        <p>
            Already have an account?

            <a href="/login">
                Login
            </a>
        </p>

    </div>

</div>

</body>

</html>
```
