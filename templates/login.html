<!DOCTYPE html>
<html>
<head>
    <title>Login - Online Complaint Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="navbar">

    <div class="logo">
        Online Complaint Management System
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </div>

</div>

<div class="container">

    <div class="card">

        <h2>LOGIN FORM</h2>

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <br>

        <p>
            Don't have an account?
            <a href="/register">Sign Up</a>
        </p>

    </div>

</div>

</body>
</html>
